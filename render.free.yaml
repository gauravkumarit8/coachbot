# Render Free plan version (demos and testing ONLY). To use it: copy this file over render.yaml, or create the service by hand
# (New > Web Service > Docker > Free) and add the same environment variables. See docs/DEPLOY_RENDER.md, "Free plan".
#
# The Free plan has NO persistent disk: whenever Render restarts, redeploys or spins down the service (it may do so at any
# time), the database and every file written while running are lost: chats, leads, status marks, and fees edited on an owner page.
# Keep everything that must last in git (the institutes folder) and rely on Telegram/email alerts as your record of leads.
# Free web services spin down after 15 minutes without a request; a monitor that calls /health every 5 minutes keeps it awake,
# but it uses your 750 free hours a month (about one service, always on).
services:
  - type: web
    name: coachbot
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: xff
      - key: PROXY_HOPS
        value: "2"               # verify with /admin/whoami (docs/DEPLOY_RENDER.md, section 5)
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DEMO_OWNER_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
