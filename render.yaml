# Render Blueprint: Render dashboard > New > Blueprint > pick this repository. See docs/DEPLOY_RENDER.md.
# A persistent disk needs a paid instance (starter or above). The free plan has no disk: data would be lost on every restart.
services:
  - type: web
    name: coachbot
    runtime: docker
    plan: starter
    region: singapore            # closest to India; cannot be changed later
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: coachbot-data
      mountPath: /data           # only files under /data survive restarts and deploys
      sizeGB: 1
    envVars:
      - key: COACHBOT_DB
        value: /data/coachbot.db
      - key: COACHBOT_INSTITUTES_DIR
        value: /data/institutes
      - key: COACHBOT_ENV_FILE
        value: /data/extra.env   # onboarding writes new owner keys here (python -m app.onboard ... --write-env)
      - key: TRUST_PROXY
        value: xff
      - key: PROXY_HOPS
        value: "2"               # verify after deploy with /admin/whoami (docs/DEPLOY_RENDER.md)
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false              # you type these in the Render dashboard; they never go in git
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DEMO_OWNER_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false              # your own address plus each client's website, comma separated
